<!DOCTYPE html>
<!--
  ============================================================
  小雞農場 電子雞遊戲
  ============================================================
  檔案結構：
    index.html      ← 你現在看的這個檔案（HTML 結構 + CSS 樣式）
    js/GameData.js  ← 模組 1：存檔/讀檔/資料管理
    js/UI.js        ← 模組 2：畫面更新
    js/Game.js      ← 模組 3：遊戲邏輯
    assets/         ← 所有圖片素材

  學習順序建議：
    1. 先看 index.html 了解 HTML 結構
    2. 看 js/GameData.js 了解資料如何儲存
    3. 看 js/UI.js 了解畫面如何更新
    4. 看 js/Game.js 了解遊戲邏輯如何運作
  ============================================================
-->
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!--
    viewport meta 標籤：讓手機瀏覽器正確縮放
    width=device-width  → 寬度等於裝置螢幕寬度
    initial-scale=1.0   → 初始縮放比例 1:1
    user-scalable=no    → 禁止使用者手動縮放（遊戲常用）
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小雞農場 🐥</title>

  <style>
    /* ========================================================
       CSS 基礎設定
       * { } 選取所有元素，box-sizing 讓寬高計算包含 padding
    ======================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; /* 手機點擊時不顯示藍色框 */
    }

    body {
      background: #1a0f00;
      display: flex;
      justify-content: center; /* 水平置中 */
      align-items: center;     /* 垂直置中 */
      min-height: 100vh;       /* 至少填滿整個視窗高度 */
      font-family: 'Arial Rounded MT Bold', 'Microsoft JhengHei', Arial, sans-serif;
      overflow: hidden;
    }

    /* ── 遊戲容器：固定 375×667 的手機尺寸 */
    #game-container {
      position: relative;
      width: 375px;
      height: 667px;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 0 60px rgba(255, 150, 50, 0.3);
    }

    /* ── 背景圖片：填滿整個容器 */
    #bg {
      position: absolute;
      inset: 0;          /* top:0; right:0; bottom:0; left:0 的縮寫 */
      width: 100%;
      height: 100%;
      object-fit: cover; /* 圖片等比例填滿，超出部分裁切 */
      z-index: 0;        /* z-index 控制層疊順序，數字越大越在前面 */
    }

    /* ========================================================
       頂部 HUD（抬頭顯示器）
    ======================================================== */
    #hud {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 235, 180, 0.92);
      border-radius: 14px;
      padding: 7px 10px;
      border: 2px solid rgba(200, 140, 60, 0.5);
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    #hud-id {
      font-size: 11px;
      color: #5a3010;
      font-weight: bold;
      background: rgba(255,255,255,0.5);
      border-radius: 8px;
      padding: 2px 7px;
    }

    #market-btn {
      margin-left: 4px;
      background: linear-gradient(135deg, #ff9a3c, #ff6b00);
      border: none;
      border-radius: 10px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(255,100,0,0.4);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #market-btn img { width: 14px; height: 14px; }

    #hud-inventory {
      margin-left: auto;
      font-size: 11px;
      color: #5a3010;
      font-weight: bold;
      background: rgba(255,255,255,0.5);
      border-radius: 8px;
      padding: 2px 8px;
    }

    #hud-coins {
      font-size: 11px;
      color: #5a3010;
      font-weight: bold;
      background: rgba(255,220,50,0.7);
      border-radius: 8px;
      padding: 2px 8px;
    }

    /* ========================================================
       左側功能按鈕（公告 / 信箱）
    ======================================================== */
    #left-btns {
      position: absolute;
      left: 8px;
      top: 72px;
      z-index: 10;
      display: flex;
      flex-direction: column; /* 垂直排列 */
      gap: 8px;
    }

    .left-btn {
      width: 46px;
      height: 46px;
      background: rgba(255, 245, 220, 0.9);
      border-radius: 12px;
      border: 2px solid rgba(200,140,60,0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
      position: relative;
      transition: transform 0.1s; /* 點擊縮放動畫 */
    }

    .left-btn:active { transform: scale(0.88); }
    .left-btn img { width: 28px; height: 28px; object-fit: contain; }

    /* 紅點通知徽章 */
    .badge {
      position: absolute;
      top: -5px;
      right: -5px;
      width: 18px;
      height: 18px;
    }

    /* ========================================================
       右側狀態條
    ======================================================== */
    #status-bars {
      position: absolute;
      right: 8px;
      top: 72px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 7px;
      width: 110px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .bar-label {
      font-size: 9px;
      color: white;
      font-weight: bold;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      width: 22px;
      flex-shrink: 0;
    }

    /* 狀態條外框 */
    .bar-track {
      flex: 1;
      height: 11px;
      background: rgba(0,0,0,0.3);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.3);
    }

    /* 狀態條填充（用 style.width 控制長度）*/
    .bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.5s ease; /* 平滑過渡動畫 */
    }

    #bar-hunger { background: linear-gradient(90deg, #ff8c00, #ffcc44); }
    #bar-happy  { background: linear-gradient(90deg, #ff69b4, #ffb6c1); }
    #bar-energy { background: linear-gradient(90deg, #32cd32, #90ee90); }

    /* ========================================================
       對話氣泡
    ======================================================== */
    #dialog {
      position: absolute;
      left: 55px;
      top: 125px;
      z-index: 20;
      display: none; /* 預設隱藏，showDialog() 會改成 block */
      pointer-events: none; /* 不攔截點擊事件 */
    }

    #dialog-bubble-img {
      width: 170px;
    }

    #dialog-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -58%);
      font-size: 12px;
      color: #5a3010;
      font-weight: bold;
      white-space: nowrap;
    }

    /* ========================================================
       主角色
    ======================================================== */
    #chicken-wrap {
      position: absolute;
      bottom: 115px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      cursor: pointer;
      /* transition 讓位置移動有平滑動畫 */
      transition: left 1.5s ease;
    }

    #chicken-img {
      width: 115px;
      height: 115px;
      object-fit: contain;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.3));
      /* 浮動動畫：用 CSS @keyframes 定義 */
      animation: float 2.5s ease-in-out infinite;
    }

    /* 浮動動畫：上下移動 8px */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-8px); }
    }

    /* 跳躍動畫：點擊時觸發 */
    #chicken-wrap.jump {
      animation: jump 0.5s ease forwards;
    }

    @keyframes jump {
      0%   { transform: translateX(-50%) translateY(0px); }
      40%  { transform: translateX(-50%) translateY(-35px); }
      100% { transform: translateX(-50%) translateY(0px); }
    }

    /* ========================================================
       小雞 NPC（裝飾用）
    ======================================================== */
    #chick-npc {
      position: absolute;
      bottom: 105px;
      right: 35px;
      z-index: 4;
      width: 48px;
      height: 48px;
      object-fit: contain;
      animation: float 3s ease-in-out infinite 0.8s; /* 延遲 0.8s 讓動畫錯開 */
      pointer-events: none;
    }

    /* ========================================================
       底部選單
    ======================================================== */
    #bottom-menu {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      background: linear-gradient(to top, rgba(120,70,20,0.97), rgba(160,100,40,0.92));
      padding: 10px 8px 18px;
      display: flex;
      justify-content: space-around;
      border-top: 2px solid rgba(255,200,100,0.3);
    }

    /* 每個選單按鈕 */
    .menu-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .menu-btn:active { transform: scale(0.85); }

    /* 按鈕圖示容器（用背景圖做圓角方形外框）*/
    .menu-icon-wrap {
      width: 56px;
      height: 56px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-icon-wrap img.btn-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    .menu-icon-wrap img.btn-icon {
      position: relative; /* 在 btn-bg 上面 */
      z-index: 1;
      width: 34px;
      height: 34px;
      object-fit: contain;
    }

    .menu-label {
      font-size: 10px;
      color: #fff5d0;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
    }

    /* ========================================================
       通用面板樣式
       .panel 預設隱藏，加上 .show class 後顯示
    ======================================================== */
    .panel {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: none;        /* 預設隱藏 */
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55); /* 半透明遮罩 */
    }

    /* 加上 .show 後顯示（openPanel() 函式會加這個 class）*/
    .panel.show {
      display: flex;
    }

    /* 面板內容框 */
    .panel-box {
      position: relative;
      width: 310px;
      background: rgba(255, 245, 220, 0.97);
      border-radius: 20px;
      padding: 20px;
      border: 3px solid rgba(200, 140, 60, 0.5);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .panel-title {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #5a3010;
      margin-bottom: 16px;
    }

    /* 關閉按鈕（右上角 × ）*/
    .close-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 28px;
      height: 28px;
      background: #ff6b6b;
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      line-height: 28px;
      text-align: center;
    }

    /* ========================================================
       商店面板
    ======================================================== */
    .shop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr; /* 兩欄 */
      gap: 10px;
    }

    .shop-item {
      background: rgba(255, 235, 180, 0.8);
      border-radius: 12px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      border: 2px solid rgba(200,140,60,0.3);
    }

    .shop-item img {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }

    .shop-item-name {
      font-size: 11px;
      font-weight: bold;
      color: #5a3010;
    }

    .shop-item-desc {
      font-size: 9px;
      color: #8a6040;
    }

    /* 購買按鈕 */
    .buy-btn {
      background: linear-gradient(135deg, #ff9a3c, #ff6b00);
      border: none;
      border-radius: 8px;
      padding: 5px 12px;
      color: white;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(255,100,0,0.3);
      transition: transform 0.1s;
    }

    .buy-btn:active { transform: scale(0.93); }

    /* ========================================================
       孵化面板
    ======================================================== */
    .hatch-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 10px 0;
    }

    #egg-img {
      width: 95px;
      height: 95px;
      object-fit: contain;
      cursor: pointer;
      transition: transform 0.15s;
    }

    #egg-img:active { transform: scale(0.88); }

    /* 孵化進度條 */
    #hatch-track {
      width: 200px;
      height: 18px;
      background: rgba(180,130,70,0.3);
      border-radius: 9px;
      overflow: hidden;
      border: 2px solid rgba(180,120,60,0.5);
    }

    #hatch-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffcc00, #ff9900);
      border-radius: 9px;
      transition: width 0.3s ease;
    }

    #hatch-label {
      font-size: 13px;
      font-weight: bold;
      color: #5a3010;
    }

    #hatch-count {
      font-size: 11px;
      color: #8a6040;
    }

    /* ========================================================
       設定面板
    ======================================================== */
    .settings-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 235, 180, 0.7);
      border-radius: 12px;
      padding: 10px 14px;
    }

    .setting-label {
      font-size: 14px;
      font-weight: bold;
      color: #5a3010;
    }

    /* 開關樣式 */
    .toggle {
      width: 44px;
      height: 24px;
      background: #ccc;
      border-radius: 12px;
      position: relative;
      cursor: pointer;
      transition: background 0.3s;
    }

    .toggle.on { background: #4caf50; }

    /* 開關的圓形滑塊 */
    .toggle::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: left 0.3s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .toggle.on::after { left: 22px; }

    /* ========================================================
       Toast 通知
    ======================================================== */
    #toast {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      background: rgba(60, 30, 5, 0.92);
      color: #fff5d0;
      padding: 9px 22px;
      border-radius: 22px;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      /* 預設不可見 */
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    /* 加上 .show 後顯示 */
    #toast.show {
      opacity: 1;
    }
  </style>
</head>

<body>
<div id="game-container">

  <!-- ── 農場背景圖 ── -->
  <img id="bg" src="assets/farm_bg.png" alt="農場背景">

  <!-- ================================================================
       頂部 HUD
       HTML 結構：外層 div 排版，內層各元素顯示資料
  ================================================================ -->
  <div id="hud">
    <span id="hud-id">ID: 000879</span>

    <!-- onclick="函式名稱()" 是最簡單的事件綁定方式 -->
    <button id="market-btn" onclick="onMarket()">
      <img src="assets/icon_market.png" alt="">
      小農市集
    </button>

    <span id="hud-inventory">庫存 0 顆</span>
    <span id="hud-coins">💰 500</span>
  </div>

  <!-- ================================================================
       左側功能按鈕
  ================================================================ -->
  <div id="left-btns">
    <button class="left-btn" onclick="onAnnouncement()">
      <img src="assets/icon_announcement.png" alt="公告">
      <img src="assets/badge_red.png" class="badge" alt="">
    </button>
    <button class="left-btn" onclick="onMail()">
      <img src="assets/icon_mail.png" alt="信箱">
    </button>
  </div>

  <!-- ================================================================
       右側狀態條
       每個 .bar-fill 的 style.width 由 UI.js 的 refreshUI() 控制
  ================================================================ -->
  <div id="status-bars">
    <div class="bar-row">
      <span class="bar-label">飢餓</span>
      <div class="bar-track">
        <div class="bar-fill" id="bar-hunger" style="width: 80%"></div>
      </div>
    </div>
    <div class="bar-row">
      <span class="bar-label">快樂</span>
      <div class="bar-track">
        <div class="bar-fill" id="bar-happy" style="width: 70%"></div>
      </div>
    </div>
    <div class="bar-row">
      <span class="bar-label">體力</span>
      <div class="bar-track">
        <div class="bar-fill" id="bar-energy" style="width: 90%"></div>
      </div>
    </div>
  </div>

  <!-- ================================================================
       對話氣泡（預設隱藏）
  ================================================================ -->
  <div id="dialog">
    <img id="dialog-bubble-img" src="assets/dialog_bubble.png" alt="">
    <span id="dialog-text">嗨！</span>
  </div>

  <!-- ================================================================
       主角色（點擊觸發 onChickenClick()）
  ================================================================ -->
  <div id="chicken-wrap" onclick="onChickenClick()">
    <img id="chicken-img" src="assets/chick_main.png" alt="主角小雞">
  </div>

  <!-- 小雞 NPC（裝飾，不可互動）-->
  <img id="chick-npc" src="assets/chick_small.png" alt="小雞NPC">

  <!-- ================================================================
       底部選單（4 個功能按鈕）
  ================================================================ -->
  <div id="bottom-menu">

    <!-- 商店按鈕 -->
    <div class="menu-btn" onclick="openPanel('shop')">
      <div class="menu-icon-wrap">
        <img src="assets/btn_normal.png" class="btn-bg" alt="">
        <img src="assets/icon_shop.png"  class="btn-icon" alt="">
      </div>
      <span class="menu-label">商店</span>
    </div>

    <!-- 配送按鈕 -->
    <div class="menu-btn" onclick="onDelivery()">
      <div class="menu-icon-wrap">
        <img src="assets/btn_normal.png"    class="btn-bg" alt="">
        <img src="assets/icon_delivery.png" class="btn-icon" alt="">
      </div>
      <span class="menu-label">配送</span>
    </div>

    <!-- 孵化按鈕 -->
    <div class="menu-btn" onclick="openPanel('hatch')">
      <div class="menu-icon-wrap">
        <img src="assets/btn_normal.png"  class="btn-bg" alt="">
        <img src="assets/icon_hatch.png"  class="btn-icon" alt="">
      </div>
      <span class="menu-label">孵化</span>
    </div>

    <!-- 設定按鈕 -->
    <div class="menu-btn" onclick="openPanel('settings')">
      <div class="menu-icon-wrap">
        <img src="assets/btn_normal.png"    class="btn-bg" alt="">
        <img src="assets/icon_settings.png" class="btn-icon" alt="">
      </div>
      <span class="menu-label">設定</span>
    </div>

  </div>

  <!-- ================================================================
       商店面板
  ================================================================ -->
  <div class="panel" id="shop-panel">
    <div class="panel-box">
      <button class="close-btn" onclick="closePanel('shop')">×</button>
      <div class="panel-title">🏪 商店</div>
      <div class="shop-grid">

        <!-- buyItem(0) 對應 SHOP_ITEMS[0]：玉米飼料 -->
        <div class="shop-item">
          <img src="assets/item_corn.png" alt="玉米">
          <div class="shop-item-name">玉米飼料</div>
          <div class="shop-item-desc">飢餓 +30</div>
          <button class="buy-btn" onclick="buyItem(0)">💰 50</button>
        </div>

        <div class="shop-item">
          <img src="assets/item_worm.png" alt="蟲蟲">
          <div class="shop-item-name">蟲蟲點心</div>
          <div class="shop-item-desc">快樂 +20</div>
          <button class="buy-btn" onclick="buyItem(1)">💰 40</button>
        </div>

        <div class="shop-item">
          <img src="assets/item_ball.png" alt="彩球">
          <div class="shop-item-name">彩色球</div>
          <div class="shop-item-desc">快樂 +25</div>
          <button class="buy-btn" onclick="buyItem(2)">💰 60</button>
        </div>

        <div class="shop-item">
          <img src="assets/item_nest.png" alt="草窩">
          <div class="shop-item-name">舒眠草窩</div>
          <div class="shop-item-desc">體力 +40</div>
          <button class="buy-btn" onclick="buyItem(3)">💰 80</button>
        </div>

      </div>
    </div>
  </div>

  <!-- ================================================================
       孵化面板
  ================================================================ -->
  <div class="panel" id="hatch-panel">
    <div class="panel-box">
      <button class="close-btn" onclick="closePanel('hatch')">×</button>
      <div class="panel-title">🥚 孵化小雞</div>
      <div class="hatch-center">
        <!-- onclick="onTapEgg()" 每點一次進度 +1 -->
        <img id="egg-img" src="assets/egg.png" alt="雞蛋" onclick="onTapEgg()">
        <div id="hatch-track">
          <div id="hatch-bar"></div>
        </div>
        <div id="hatch-label">點擊雞蛋來孵化！</div>
        <div id="hatch-count">進度：0 / 10</div>
      </div>
    </div>
  </div>

  <!-- ================================================================
       設定面板
  ================================================================ -->
  <div class="panel" id="settings-panel">
    <div class="panel-box">
      <button class="close-btn" onclick="closePanel('settings')">×</button>
      <div class="panel-title">⚙️ 設定</div>
      <div class="settings-list">
        <div class="setting-row">
          <span class="setting-label">推播通知</span>
          <!-- toggleSwitch(this) 傳入自己，切換 .on class -->
          <div class="toggle on" onclick="toggleSwitch(this)"></div>
        </div>
        <div class="setting-row">
          <span class="setting-label">音效</span>
          <div class="toggle on" onclick="toggleSwitch(this)"></div>
        </div>
        <div class="setting-row">
          <span class="setting-label">震動</span>
          <div class="toggle" onclick="toggleSwitch(this)"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================================================================
       Toast 通知（預設透明，.show 後顯示）
  ================================================================ -->
  <div id="toast"></div>

</div><!-- end #game-container -->

<!-- ================================================================
     載入 JavaScript 模組
     注意：順序很重要！
     1. GameData.js 先載入（定義 loadData / saveData / clamp）
     2. UI.js 再載入（定義 DOM 變數和 UI 函式）
     3. Game.js 最後載入（使用前兩個模組的函式）
================================================================ -->
<script src="js/GameData.js"></script>
<script src="js/UI.js"></script>
<script src="js/Game.js"></script>

<script>
  /**
   * window.onload：等整個頁面（包含所有圖片）載入完成後才執行
   * 這樣可以確保所有 DOM 元素都已存在，不會出現「找不到元素」的錯誤
   */
  window.onload = function() {
    initGame(); // 呼叫 Game.js 中的初始化函式
  };
</script>

</body>
</html>
